baseURL = 'https://www.indiehackerspr.com/'
locale = 'es-PR'
title = 'Indie Hackers Puerto Rico'
disableKinds = ['taxonomy', 'term', 'rss']
enableRobotsTXT = true
copyright = 'Licencia Creative Commons Atribución-CompartirIgual 3.0'

[params]
  images = ['images/og.png']
  description = 'El hogar de los emprendedores independientes en Puerto Rico. Meetups mensuales en Santurce y una comunidad en Slack para quienes trabajan remoto, son freelancers o trabajan solos.'
  [params.links]
    slack = 'https://communityinviter.com/apps/indiehackerspr/indie-hackers-puerto-rico'
    twitter = 'https://twitter.com/indiehackerspr'
    youtube = 'https://www.youtube.com/channel/UCYqirt7QurXFiXkgMgz6QMA'
    venue = 'https://piloto151.com/santurce-suites/'
    addPlace = 'https://indiehackerpr.paperform.co'

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[imaging]
  [imaging.webp]
    quality = 80

[menus]
  [[menus.main]]
    name = 'Meetups'
    url = '/#meetups'
    weight = 10
  [[menus.main]]
    name = 'Miembros'
    url = '/#miembros'
    weight = 20
  [[menus.main]]
    name = 'Dónde trabajar remoto'
    pageRef = '/trabajo-remoto'
    weight = 30

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[security.exec]
  allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
