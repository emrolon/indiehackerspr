baseURL = 'https://www.indiehackerspr.com/'
locale = 'es-PR'
title = 'Indie Hackers Puerto Rico'
disableKinds = ['taxonomy', 'term', 'rss']
enableRobotsTXT = true
copyright = 'Licencia Creative Commons Atribución-CompartirIgual 3.0'

[params]
  images = ['images/og.png']
  # Typed into ChatGPT, Claude, Perplexity or Google AI Mode by the footer's "Pregúntale a tu IA" keys.
  preguntaIA = '¿Qué es Indie Hackers Puerto Rico (indiehackerspr.com)? Quién la fundó, qué hacen en el Mastermind de los viernes y cómo me uno a la comunidad en Slack.'
  description = 'El hogar de los emprendedores independientes en Puerto Rico. Un Mastermind online cada viernes y una comunidad en Slack para quienes trabajan remoto, son freelancers o trabajan solos.'
  [params.links]
    slack = 'https://communityinviter.com/apps/indiehackerspr/indie-hackers-puerto-rico'
    twitter = 'https://twitter.com/indiehackerspr'
    youtube = 'https://www.youtube.com/channel/UCYqirt7QurXFiXkgMgz6QMA'
    luma = 'https://luma.com/indiehackers_pr'
    addPlace = 'https://indiehackerpr.paperform.co'
    github = 'https://github.com/gabrieljoel/indiehackerspr'
  [params.founder]
    name = 'Gabriel J. Pérez Irizarry'
    url = 'https://gabezen.com'
  # Weekly online session, published on the Luma calendar.
  [params.mastermind]
    name = 'Mastermind: Feedback para nuestros ventures'
    time = '10:00–11:00 AM'
    utcHour = 14
    platform = 'Google Meet'
    host = 'Emanuel Rolon'

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[imaging]
  [imaging.webp]
    quality = 80

[menus]
  [[menus.main]]
    name = 'Mastermind'
    url = '/#mastermind'
    weight = 10
  [[menus.main]]
    name = 'Miembros'
    url = '/#miembros'
    weight = 20
  [[menus.main]]
    name = 'Dónde trabajar remoto'
    pageRef = '/trabajo-remoto'
    weight = 30
  [[menus.main]]
    name = 'Contribuye'
    pageRef = '/contribuye'
    weight = 40

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[security.exec]
  allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
