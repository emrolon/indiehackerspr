{{ define "main" }}
  <section class="mx-auto max-w-3xl px-4 py-16 sm:px-6">
    <h1 class="display text-4xl sm:text-5xl">{{ .Title }}</h1>
    <div class="prose prose-lg mt-8">{{ .Content }}</div>
    <ul class="mt-10 space-y-4">
      {{ range .Pages }}
        <li><a href="{{ .RelPermalink }}" class="text-lg font-semibold underline underline-offset-4">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  </section>
{{ end }}
